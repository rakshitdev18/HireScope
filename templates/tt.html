<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Entering WorkArena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
{% load static %}
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: black;
    color: white;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.container {
    max-width: 800px;
    padding: 20px;
}

.message {
    font-size: 28px;
    margin-bottom: 30px;
    font-weight: 500;
}

.countdown {
    font-size: 60px;
    font-weight: bold;
    letter-spacing: 5px;
}

</style>
</head>
<body>
{%if role_name%}
<div class="container">
    <div class="message">
        You are going to enter into a job role of <br>
        <strong>{{ role_name }} at WA Technologies</strong>
    </div>
    <div class="countdown" id="countdown">10</div>
</div>{% endif %}
<script src="{% static 'hh/static/js/script.js' %}"></script> 
</body>
</html>
