<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entering WorkArena</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: black;
    color: white;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.container {
    max-width: 800px;
    padding: 20px;
}

.message {
    font-size: 28px;
    margin-bottom: 30px;
    font-weight: 500;
}

.countdown {
    font-size: 60px;
    font-weight: bold;
    letter-spacing: 5px;
}
</style>
</head>

<body>

<div class="container">
    <div class="message">
        You are going to enter into a job role of <br>
        <strong>Frontend Developer at WA Technologies</strong>
    </div>

    <div class="countdown" id="countdown">10</div>
</div>

<script>
let timeLeft = 10;
const countdownElement = document.getElementById("countdown");

const timer = setInterval(() => {
    timeLeft--;
    countdownElement.textContent = timeLeft;

    if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = "/begin/"; // Redirect to the welcome page after countdown
    }
}, 1000);
</script>
 
</body>
</html>
